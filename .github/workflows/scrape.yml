name: BWI Hourly Parking Scraper

on:
  schedule:
    # Runs once an hour at the 17th minute (e.g., 1:17, 2:17, 3:17 UTC)
    - cron: '17 * * * *'
  workflow_dispatch:
  
jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push the CSV update

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pytz

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bwi_parking_data.csv
          git commit -m "Update BWI parking data [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
