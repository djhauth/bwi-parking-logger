name: BWI Hourly Parking Scraper

on:
  schedule:
    # Runs every 10 minutes (:00, :10, :20, :30, :40, :50)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering anytime

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update BWI parking data [skip ci]"
          file_pattern: 'bwi_parking_data.csv'
